name: canosp
channels:
  - conda-forge
dependencies:
  - cachetools
  - click
  - jsonschema
  - jupyter
  - keras
  - matplotlib
  - nltk
  - pandas
  - pathlib
  - pip
  - pytest
  - python=3.7
  - python-dateutil
  - pytz
  - scikit-learn
