name: Setup Anaconda environment

on:
  push:
    branches:
    - will-conda-migration
  pull_request:
    branches:
    - will-conda-migration

jobs:
  example-1:
    name: Ex1 (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.7']
    steps:
      - uses: actions/checkout@v2
        with:
          ref: will-conda-migration
      - uses: goanpeca/setup-miniconda@v1
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
      - name: Conda info
        shell: bash
        run: conda info
      - name: Create environment from environment.yml
        shell: bash
        run: |
          CFLAGS="-Wno-narrowing" pip install cld2-cffi
          conda env create -f $GITHUB_WORKSPACE/environment.yml
