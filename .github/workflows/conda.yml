name: Setup Anaconda environment

on:
  push:
    branches:
    - '*'
  pull_request:
    branches:
    - '*'

jobs:
  example-1:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        python-version: ['3.7']
    steps:
      - uses: actions/checkout@v2
        with:
          ref: will-conda-migration
      - uses: goanpeca/setup-miniconda@v1
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
      - name: Conda info
        shell: bash -l {0}
        run: conda info
      - name: Create environment from environment.yml
        shell: bash -l {0}
        env:
          CFLAGS: -Wno-narrowing
        run: |
          conda env create --file $GITHUB_WORKSPACE/environment.yml
